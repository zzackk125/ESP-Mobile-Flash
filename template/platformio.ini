; ESP Mobile Flash project template.
; Every [env:*] below is built by CI and shows up as a flashable build in the
; mobile flasher. Add/remove envs to match the boards you actually use.

[env]
; pioarduino = maintained Arduino-ESP32 v3.x platform (needed for ESP32-C6).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

[env:esp32-s3]
board = esp32-s3-devkitc-1
; Route Serial to the native USB port so logs show up over the same cable.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-c6]
board = esp32-c6-devkitc-1
